[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2sql-l20"
version = "0.1.0"
description = "Natural language to SQL fine-tuning and public benchmark comparison on one L20 GPU."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "NL2SQL L20 Contributors" }
]
dependencies = [
  "accelerate>=0.34.0",
  "datasets>=2.20.0,<5.0",
  "numpy>=1.26.0",
  "peft>=0.13.0",
  "pyyaml>=6.0.1",
  "torch>=2.6.0,<2.7",
  "tqdm>=4.66.0",
  "transformers>=4.46.0,<5.0"
]

[project.optional-dependencies]
train = [
  "bitsandbytes>=0.43.3"
]
perf = [
  "flash-attn>=2.6.3; platform_system == 'Linux'",
  "liger-kernel>=0.5.0"
]
dev = [
  "ruff>=0.6.8",
  "pytest>=8.3.0"
]

[project.scripts]
nl2sql-prepare = "nl2sql_l20.prepare:main"
nl2sql-train = "nl2sql_l20.train_lora:main"
nl2sql-infer = "nl2sql_l20.infer:main"
nl2sql-pipeline = "nl2sql_l20.pipeline:main"
nl2sql-benchmark = "nl2sql_l20.benchmark_suite:main"
nl2sql-eval = "nl2sql_l20.evaluate:main"
nl2sql-export-spider = "nl2sql_l20.export_spider:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
