extends: configs/experiment_rich_context_spider_l20_mfu.yaml

experiment:
  name: candidate_repair_spider_qwen25_coder_7b_l20_mfu
  architecture: candidate_repair

data:
  train_file: data/processed/spider_train_candidate_repair.jsonl
  eval_file:

training:
  output_dir: outputs/candidate_repair_spider_qwen25_coder_7b_l20_mfu
  max_seq_length: 4096
  max_steps: 180
  num_train_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  warmup_ratio: 0.04
  logging_steps: 5
  eval_steps: 1000
  save_steps: 90
  save_total_limit: 2
  sequence_packing: true
  drop_remainder: true

generation:
  max_new_tokens: 512
  temperature: 0.0
  top_p: 1.0

performance:
  mfu:
    log_path: outputs/candidate_repair_spider_qwen25_coder_7b_l20_mfu/perf.jsonl
