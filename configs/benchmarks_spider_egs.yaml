output_dir: evals/sota
skip_missing: false

benchmarks:
  - name: spider_dev_egs_n32
    input: data/processed/spider_dev.jsonl
    mode: pipeline
    pipeline_config: configs/pipeline_spider_egs_l20.yaml
    only_architectures:
      - rich_context
    architectures:
      - rich_context
      - execution_first
      - query_plan
      - skeleton
    samples_per_architecture: 8
    temperature: 0.85
    top_p: 0.95
    selection_strategy: execution_guided_rerank
    execute: true
    export_spider: true
