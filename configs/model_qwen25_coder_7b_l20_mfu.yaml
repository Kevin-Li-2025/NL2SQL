extends: configs/model_qwen25_coder_7b_l20.yaml

model:
  base_model: models/Qwen2.5-Coder-7B-Instruct
  load_in_4bit: false
  attn_implementation: sdpa
  use_liger_kernel: true
  liger:
    rope: true
    rms_norm: true
    swiglu: true
    cross_entropy: false
    fused_linear_cross_entropy: true

performance:
  enable_tf32: true
  float32_matmul_precision: high
  mfu:
    enabled: true
    target: 0.60
    gpu_peak_tflops: 119.5
    dense_flop_multiplier: 6.0
    lora_flop_multiplier: 4.0
    warmup_steps: 8
    print_steps: 5
