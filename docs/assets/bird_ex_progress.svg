<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
  <title id="title">BIRD Mini-Dev execution accuracy progression</title>
  <desc id="desc">Bar chart showing BIRD Mini-Dev execution accuracy improving from Direct to Schema-aware to MCR to VAV temperature 0.9.</desc>
  <rect width="760" height="320" fill="#ffffff"/>
  <text x="32" y="42" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">BIRD Mini-Dev EX progression</text>
  <text x="32" y="68" font-family="Inter, Arial, sans-serif" font-size="13" fill="#4b5563">Fresh single-pool runs. Execution accuracy is the meaningful target metric for this transfer setting.</text>
  <line x1="120" y1="250" x2="708" y2="250" stroke="#d1d5db" stroke-width="1"/>
  <line x1="120" y1="96" x2="120" y2="250" stroke="#d1d5db" stroke-width="1"/>
  <text x="54" y="254" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6b7280">20%</text>
  <text x="54" y="104" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6b7280">50%</text>
  <line x1="120" y1="100" x2="708" y2="100" stroke="#eef2f7" stroke-width="1"/>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="150" y="242" width="92" height="8" rx="4" fill="#64748b"/>
    <text x="196" y="232" font-size="14" font-weight="700" text-anchor="middle" fill="#111827">21.60%</text>
    <text x="196" y="276" font-size="13" text-anchor="middle" fill="#374151">Direct</text>
    <rect x="290" y="163" width="92" height="87" rx="4" fill="#2563eb"/>
    <text x="336" y="153" font-size="14" font-weight="700" text-anchor="middle" fill="#111827">37.40%</text>
    <text x="336" y="276" font-size="13" text-anchor="middle" fill="#374151">Schema</text>
    <rect x="430" y="154" width="92" height="96" rx="4" fill="#059669"/>
    <text x="476" y="144" font-size="14" font-weight="700" text-anchor="middle" fill="#111827">39.20%</text>
    <text x="476" y="276" font-size="13" text-anchor="middle" fill="#374151">MCR n8</text>
    <rect x="570" y="111" width="92" height="139" rx="4" fill="#dc2626"/>
    <text x="616" y="101" font-size="14" font-weight="700" text-anchor="middle" fill="#111827">47.80%</text>
    <text x="616" y="276" font-size="13" text-anchor="middle" fill="#374151">VAV n20</text>
  </g>
</svg>
